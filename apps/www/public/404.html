<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>shadcn-aurelia</title>
  <script>
    const pendingRouteKey = 'gh-pages-route'
    const pathSegments = window.location.pathname.split('/').filter(Boolean)
    const basePath = window.location.hostname.endsWith('.github.io') && pathSegments.length > 0
      ? `/${pathSegments[0]}/`
      : '/'
    const routePath = `/${window.location.pathname.slice(basePath.length).replace(/^\/?/, '')}${window.location.search}${window.location.hash}`

    sessionStorage.setItem(pendingRouteKey, routePath || '/')
    window.location.replace(basePath)
  </script>
</head>
<body></body>
</html>
