<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>shadcn-aurelia</title>
  <script>
    const routeParam = 'gh_pages_route'
    const pathSegments = window.location.pathname.split('/').filter(Boolean)
    const basePath = window.location.hostname.endsWith('.github.io') && pathSegments.length > 0
      ? `/${pathSegments[0]}/`
      : '/'
    const relativePath = window.location.pathname === basePath
      ? ''
      : window.location.pathname.slice(basePath.length)
    const routePath = `${relativePath}${window.location.search}${window.location.hash}`
    const redirectUrl = new URL(basePath, window.location.origin)

    if (routePath !== '') {
      redirectUrl.searchParams.set(routeParam, routePath)
    }

    window.location.replace(redirectUrl)
  </script>
</head>
<body></body>
</html>
