<import from="../../../components/component-preview"></import>

<article class="space-y-8 pb-16">
  <header class="space-y-2">
    <h1 class="text-3xl font-bold tracking-tight">Blocks</h1>
    <p class="text-muted-foreground">
      Ready-made page sections composed from the components. Add one with
      <code class="rounded bg-muted px-1.5 py-0.5 font-mono text-sm text-foreground">npx shadcn-aurelia add login-01</code>
      — it lands under <code class="rounded bg-muted px-1.5 py-0.5 font-mono text-sm text-foreground">@/components/blocks/</code>
      together with every component it uses.
    </p>
  </header>

  <section repeat.for="b of blocks" class="space-y-3">
    <div class="space-y-1">
      <h2 class="text-xl font-semibold tracking-tight">${b.title}</h2>
      <p class="text-sm text-muted-foreground">${b.description} <code class="font-mono">${b.name}</code></p>
    </div>
    <component-preview code.bind="b.source">
      <au-compose component.bind="b.component"></au-compose>
    </component-preview>
  </section>
</article>
