<div class="mx-auto flex w-full max-w-6xl gap-10 px-4 py-8">
  <aside class="hidden w-52 shrink-0 md:block">
    <nav
      aria-label="Docs"
      class="sticky top-20 max-h-[calc(100vh-6rem)] space-y-6 overflow-y-auto pb-4 text-sm"
    >
      <div>
        <p class="mb-2 font-semibold">Getting Started</p>
        <ul class="space-y-1">
          <li repeat.for="g of guides">
            <a
              load="${g.path}"
              class="text-muted-foreground hover:text-foreground [&.active]:bg-accent [&.active]:text-accent-foreground block cursor-pointer rounded-md px-2 py-1 transition-colors [&.active]:font-medium"
            >
              ${g.title}
            </a>
          </li>
        </ul>
      </div>
      <div>
        <p class="mb-2 font-semibold">Components</p>
        <ul class="space-y-1">
          <li repeat.for="c of components">
            <a
              load="components/${c.name}"
              class="text-muted-foreground hover:text-foreground [&.active]:bg-accent [&.active]:text-accent-foreground block cursor-pointer rounded-md px-2 py-1 transition-colors [&.active]:font-medium"
            >
              ${c.title}
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </aside>

  <div class="min-w-0 flex-1">
    <au-viewport></au-viewport>
  </div>
</div>
