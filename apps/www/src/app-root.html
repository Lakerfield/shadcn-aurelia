<import from="./components/theme-toggle"></import>

<div class="flex min-h-screen flex-col bg-background text-foreground">
  <header class="sticky top-0 z-40 border-b border-border bg-background/95 backdrop-blur">
    <div class="mx-auto flex h-14 w-full max-w-6xl items-center gap-6 px-4">
      <a load="route: home; context.bind: null" class="cursor-pointer text-sm font-bold">shadcn-aurelia</a>
      <nav class="flex flex-1 items-center gap-4 text-sm text-muted-foreground">
        <a load="route: docs; context.bind: null"
           class="cursor-pointer transition-colors hover:text-foreground [&.active]:text-foreground">Docs</a>
        <a load="route: docs/components/button; context.bind: null"
           class="cursor-pointer transition-colors hover:text-foreground [&.active]:text-foreground">Components</a>
      </nav>
      <theme-toggle></theme-toggle>
    </div>
  </header>

  <main class="flex-1">
    <au-viewport></au-viewport>
  </main>

  <footer class="border-t border-border py-6">
    <p class="mx-auto max-w-6xl px-4 text-sm text-muted-foreground">
      Built with Aurelia 2. A port of shadcn/ui.
    </p>
  </footer>
</div>
