<import from="./components/theme-toggle"></import>

<div class="bg-background text-foreground flex min-h-screen flex-col">
  <header class="border-border bg-background/95 sticky top-0 z-40 border-b backdrop-blur">
    <div class="mx-auto flex h-14 w-full max-w-6xl items-center gap-6 px-4">
      <a load="route: home; context.bind: null" class="cursor-pointer text-sm font-bold"
        >shadcn-aurelia</a
      >
      <nav aria-label="Main" class="text-muted-foreground flex flex-1 items-center gap-4 text-sm">
        <a
          load="route: docs; context.bind: null"
          class="hover:text-foreground [&.active]:text-foreground cursor-pointer transition-colors"
          >Docs</a
        >
        <a
          load="route: docs/components/button; context.bind: null"
          class="hover:text-foreground [&.active]:text-foreground cursor-pointer transition-colors"
          >Components</a
        >
      </nav>
      <a
        href="https://github.com/lakerfield/shadcn-aurelia"
        external
        target="_blank"
        rel="noreferrer"
        aria-label="GitHub repository"
        class="text-muted-foreground hover:text-foreground transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-4"
          aria-hidden="true"
        >
          <path
            d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.16 1.18a11 11 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.7 5.39-5.27 5.67.41.36.78 1.06.78 2.14 0 1.54-.01 2.79-.01 3.17 0 .31.2.67.8.55A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
          />
        </svg>
      </a>
      <theme-toggle></theme-toggle>
    </div>
  </header>

  <main class="flex-1">
    <au-viewport></au-viewport>
  </main>

  <footer class="border-border border-t py-6">
    <p class="text-muted-foreground mx-auto max-w-6xl px-4 text-sm">
      Built with Aurelia 2. A port of shadcn/ui. The source code is available on
      <a
        href="https://github.com/lakerfield/shadcn-aurelia"
        external
        target="_blank"
        rel="noreferrer"
        class="hover:text-foreground font-medium underline underline-offset-4"
        >GitHub</a
      >.
    </p>
  </footer>
</div>
