<main class="mx-auto flex max-w-xl flex-col items-center gap-4 p-8">
  <h1 class="text-2xl font-semibold">Aurelia 2 + shadcn-aurelia</h1>
  <ol class="text-muted-foreground list-inside list-decimal space-y-2 text-sm">
    <li>
      Run <code class="bg-muted rounded px-1.5 py-0.5">npx shadcn-aurelia add button</code>
    </li>
    <li>
      Open
      <a
        href="https://shadcn-aurelia.com/docs/components/button"
        target="_blank"
        rel="noreferrer"
        class="underline underline-offset-4"
        >shadcn-aurelia.com/docs/components/button</a
      >
      and copy the HTML example
    </li>
    <li>
      Paste the <code class="bg-muted rounded px-1.5 py-0.5">&lt;import&gt;</code> at the top of
      <code class="bg-muted rounded px-1.5 py-0.5">src/my-app.html</code> and the component markup
      in the page, then compose your UI from there
    </li>
  </ol>
</main>
